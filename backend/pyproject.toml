[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roia"
version = "0.1.0"
description = "Research Opportunity Intelligence — 3 ranked research directions for a grant call, each backed by retrieved evidence"
requires-python = "==3.12.*"

# Pinned exactly, not floored. This is a demo that has to run on a specific day;
# a transitive minor bump the morning of is not a risk worth carrying. Every
# version below is the one WI-0.1/0.2 verified live.
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "trafilatura==2.2.0",
    "pymupdf4llm==1.28.2",     # pulls pymupdf-layout at the same version
    "pymupdf==1.28.2",         # imported directly: to_markdown needs a Document, not bytes
    "pyalex==0.21",
    "google-genai==2.22.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.20",  # the PLUS upload endpoint; FastAPI needs it for multipart
    "sse-starlette==3.4.10",
    "jinja2==3.1.6",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    # WI-2.2: the SSE generator is an async object, and driving it directly is far more
    # precise than inferring its behaviour from bytes on a socket.
    "pytest-asyncio==1.4.0",
    # WI-2.4a: the browser tests live here rather than in frontend/ so there is one runner,
    # one marker vocabulary and one venv. Needs `playwright install chromium` once.
    "pytest-playwright==0.9.0",
    "ruff==0.15.4",
    "mypy==1.19.0",
    # Real stubs rather than an ignore_missing_imports override: they immediately caught
    # make_links_absolute being absent from the annotated return type (WI-1.4).
    "lxml-stubs==0.5.1",
]

[tool.setuptools]
packages = ["roia"]

[tool.pytest.ini_options]
# Network tests stay out of the default run: a suite that fails on hotel wifi is
# a suite people stop running. `pytest -m live` opts back in.
# Neither network tests nor browser tests run by default: `live` needs credentials and
# `e2e` needs chromium plus a built `frontend/dist/`. Both are opted into explicitly, which
# is exactly how the skill prompt invokes them.
addopts = "-m 'not live and not e2e' -q"
testpaths = ["tests"]
pythonpath = ["."]          # so `import roia` works without an editable install
markers = [
    "live: hits the network (OpenAlex, Gemini, or a real page). Excluded by default.",
    "e2e: drives the browser via Playwright. Needs chromium and a built frontend/dist/. Excluded by default; `pytest tests/e2e -m e2e` opts in.",
]
# Explicit, not auto: every other test in this suite is synchronous, and auto mode would
# silently take ownership of any coroutine a future test defines.
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
# The spikes are one-off verification scripts, committed as evidence for WI-0.0
# and WI-0.2 and deliberately written compact (grouped imports, named lambdas).
# Linting them now would mean rewriting another work item's finished output.
exclude = ["spikes", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["roia"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# No stubs published for these; we type our own wrappers around them instead.
module = ["pyalex.*", "trafilatura.*", "pymupdf4llm.*", "sse_starlette.*"]
ignore_missing_imports = true
